<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03- lógica de programação</title>
    
    <link rel="stylesheet" href="css/style_veiculos.css">
    <script src = 'js/script_calculo.js'></script>
    <script src = "js/script_veiculos.js"></script>
    
</head>
<body>
    <div id="geral">
        <h3>Cadastro de Veículos</h3>

    <div id="div-form">

        <form id="formDados">
            <label for="modelo"> Modelo </label>
            <input type="text" name="modelo" id="modelo">
            

            <label for="marca"> Marca </label>
            <input type="text" name="marca" id="marca">

            <label for="placa"> Placa </label>
            <input type="text" name="placa" id="placa">

            <label for="anodefabricacao"> Ano de fabricação </label>
            <input type="text" name="anodefabricacao" id="anodefabricacao">

            <label for="valormercadoveiculo"> Valor de mercado do veículo </label>
            <input type="text" name="valormercadoveiculo" id="valormercadoveiculo">

            <p>Tipo de combustível</p>

            <input type="radio" name = 'tipodecombustivel' value = 'gasolina'> Gasolina           
            <input type="radio" name = 'tipodecombustivel' value = 'etanol'> Etanol
            <input type="radio" name = 'tipodecombustivel' value = 'bicombustivel'> Bicombustìvel
            <input type="radio" name = 'tipodecombustivel' value = 'hibrido'> Híbrido
            <input type="radio" name = 'tipodecombustivel' value = 'eletrico'> Elétrico
             <br><br>

            <button type="submit"> Enviar </button>
            <button type="reset"> Limpar </button>

        </form>

    </div>

    <div id="lista-veiculos"></div>

    </div>
</body>
</html>
